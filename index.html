<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>friends.cake</title>
<style>
  :root{
    --bg1:#fff5f7; --bg2:#ffe8ee; --card:#ffffff; --accent:#e0668a; --accent-dark:#c94f72;
    --text:#3a2a30; --muted:#8a747c;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg1:#241a1e; --bg2:#2e2024; --card:#332428; --accent:#e88aa4; --accent-dark:#f2a5ba;
      --text:#f5e9ec; --muted:#c2a8b0;
    }
  }
  :root[data-theme="dark"]{
    --bg1:#241a1e; --bg2:#2e2024; --card:#332428; --accent:#e88aa4; --accent-dark:#f2a5ba;
    --text:#f5e9ec; --muted:#c2a8b0;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  body{
    height:100%; margin:0; background:linear-gradient(180deg,var(--bg1),var(--bg2));
    font-family:'Tahoma','Segoe UI',sans-serif; color:var(--text);
    display:flex; justify-content:center;
  }
  .wrap{width:100%; max-width:480px; padding:36px 20px 40px; text-align:center;}
  .avatar{
    width:96px; height:96px; border-radius:50%; margin:0 auto 14px;
    background:var(--accent); display:flex; align-items:center; justify-content:center;
    font-size:40px; box-shadow:0 6px 20px rgba(224,102,138,.35);
  }
  h1{margin:0 0 6px; font-size:22px;}
  p.bio{margin:0 0 28px; color:var(--muted); font-size:14px; line-height:1.6;}
  a.link{
    display:block; background:var(--card); color:var(--text); text-decoration:none;
    padding:16px 18px; border-radius:16px; margin-bottom:14px; font-size:15px; font-weight:600;
    box-shadow:0 2px 10px rgba(0,0,0,.06); transition:transform .15s ease;
  }
  a.link:active{ transform:scale(0.97); }
  a.link span.emoji{ margin-inline-end:8px; }
  .info{
    background:var(--card); border-radius:16px; padding:16px 18px; margin-bottom:14px;
    font-size:14px; color:var(--muted); text-align:right;
  }
  .info b{ color:var(--text); display:block; margin-bottom:4px; }
  footer{ margin-top:20px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="avatar">🎂</div>
  <h1>friends.cake</h1>
  <p class="bio">نصنع الحلا بطريقتنا الخاصة 💕<br>كيكات مميزة لكل المناسبات – تصميم حسب الطلب – نكهات فريدة</p>

  <a class="link" href="https://drive.google.com/file/d/1iK1-nq8f1cGrQ2qjt1RM8kvalY9BxKp1/view?usp=sharing" target="_blank"><span class="emoji">📖</span>قائمة الأصناف (المنيو)</a>
  <a class="link" href="https://www.instagram.com/friendscake.jo/" target="_blank"><span class="emoji">📷</span>انستقرام</a>
  <a class="link" href="https://www.facebook.com/share/1D9qekX6LG/" target="_blank"><span class="emoji">💬</span>فيسبوك</a>
  <a class="link" href="tel:+962000000000"><span class="emoji">📞</span>اتصل بنا</a>

  <div class="info">
    <b>📍 الموقع</b>
    عمان، الأردن — XVG3+436
  </div>

  <footer>© friends.cake</footer>
</div>
</body>
</html>
